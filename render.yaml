
services:
  - type: worker
    name: telegram-userbot-controller
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRINGS
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./database/bot.db
      - key: DEFAULT_SEND_INTERVAL_MINUTES
        value: 5
      - key: MIN_RANDOM_DELAY
        value: 10
      - key: MAX_RANDOM_DELAY
        value: 30
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/database
      sizeGB: 1
